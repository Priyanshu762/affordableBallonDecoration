<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="balloonGradient" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c44569;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Balloon -->
  <ellipse cx="50" cy="35" rx="25" ry="30" fill="url(#balloonGradient)" stroke="#a5406b" stroke-width="1"/>
  
  <!-- Balloon highlight -->
  <ellipse cx="42" cy="28" rx="8" ry="10" fill="#ffb3d1" opacity="0.6"/>
  
  <!-- String -->
  <line x1="50" y1="65" x2="50" y2="85" stroke="#666" stroke-width="2" stroke-linecap="round"/>
  
  <!-- String curve -->
